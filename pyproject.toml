[project]
name = "home-credit-default-risk"
version = "0.1.0"
description = "XGBoost model for the Kaggle Home Credit Default Risk competition"
requires-python = ">=3.12"

dependencies = [
    # Core modelling stack
    "xgboost>=2.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.13",

    # Diagnostics: SHAP explanations and plotting
    "shap>=0.46",
    "matplotlib>=3.9",

    # SHAP pulls in numba/llvmlite. Without these floors uv can backtrack to
    # llvmlite 0.36, which has no py3.12 wheel and whose source build hard-fails
    # with "only versions >=3.6,<3.10 are supported".
    "numba>=0.60",
    "llvmlite>=0.43",

    # Hyperparameter search. plotly backs Optuna's interactive HTML figures
    # (parameter importance, slice, parallel coordinate, contour).
    "optuna>=4.0",
    "plotly>=5.24",

    # Faster CSV reads for the 2.7 GB of source tables.
    "pyarrow>=17.0",

    # Competition data download and submission. Authenticates from the
    # KAGGLE_API_TOKEN env var; see the README's submission section.
    "kaggle>=1.6",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[tool.uv]
# Keep resolution reproducible across machines.
package = false
